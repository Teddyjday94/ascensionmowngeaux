name: Import staged client media

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/**'

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract staged media
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/client-media.part-* | tr -d '\n\r ' | base64 --decode > /tmp/client-media.tar.gz
          tar -xzf /tmp/client-media.tar.gz -C .
          rm -rf .asset-staging

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import client project photos and walkthrough video"
          git push
