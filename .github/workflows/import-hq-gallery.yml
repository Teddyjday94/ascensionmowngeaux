name: Import high-quality gallery media

on:
  push:
    branches: [media-refresh-finalize]
    paths:
      - '.asset-staging/HQ_READY'

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import high-quality gallery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/client /tmp/hq-gallery
          cat .asset-staging/hq-gallery.part-* | tr -d '\n\r ' | base64 --decode > /tmp/hq-gallery.tar
          tar -xf /tmp/hq-gallery.tar -C /tmp/hq-gallery
          for name in \
            dirt-work-grading-wide-03 \
            dirt-work-side-access \
            landscape-bed-front-close \
            landscape-poolside-tree-row-02 \
            lawn-maintenance-front-yard-01 \
            lawn-maintenance-front-yard-02
          do
            cp "/tmp/hq-gallery/${name}.avif" "images/client/${name}.avif"
            rm -f "images/client/${name}.webp"
            sed -i "s|images/client/${name}.webp|images/client/${name}.avif|g" gallery.html
          done
          rm -rf .asset-staging
          rm -f .github/workflows/import-hq-gallery.yml

      - name: Commit high-quality images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace gallery images with high-quality versions"
          git push origin HEAD:media-refresh-finalize
